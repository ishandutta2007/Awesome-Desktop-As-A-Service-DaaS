<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="drop-shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; font-size: 52px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 22px; fill: #cbd5e1; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #38bdf8; }
    
    /* Subtle Dynamic Animations */
    @keyframes pulse-slow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }
    @keyframes float-slow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    .pulsing-orb { animation: pulse-slow 6s ease-in-out infinite; transform-origin: center; }
    .floating-card { animation: float-slow 5s ease-in-out infinite; }
    .animated-line { stroke-dasharray: 8, 8; animation: dash 2s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>

  <!-- Grid Pattern Layer -->
  <g opacity="0.1">
    <path d="M0 50H1200 M0 100H1200 M0 150H1200 M0 200H1200 M0 250H1200 M0 300H1200 M0 350H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M100 0V400 M200 0V400 M300 0V400 M400 0V400 M500 0V400 M600 0V400 M700 0V400 M800 0V400 M900 0V400 M1000 0V400 M1100 0V400" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Dynamic Animated Glow Orbs (Positioned in Background) -->
  <circle cx="950" cy="120" r="180" fill="url(#accent-purple)" opacity="0.25" class="pulsing-orb" filter="url(#glow)"/>
  <circle cx="150" cy="300" r="140" fill="url(#accent-cyan)" opacity="0.2" class="pulsing-orb" filter="url(#glow)"/>

  <!-- Background Decorative Architecture Lines (Behind Text) -->
  <g stroke="url(#accent-cyan)" stroke-width="2" opacity="0.3">
    <path d="M 750 320 L 850 250 L 1050 250" fill="none" class="animated-line"/>
    <circle cx="750" cy="320" r="4" fill="#06b6d4"/>
    <circle cx="850" cy="250" r="4" fill="#06b6d4"/>
    <circle cx="1050" cy="250" r="4" fill="#06b6d4"/>
  </g>

  <!-- Floating Decorative Cloud Desktop Card (Right Side - Non-overlapping) -->
  <g transform="translate(820, 100)" class="floating-card" filter="url(#drop-shadow)">
    <!-- Card Frame -->
    <rect width="320" height="200" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>
    <rect width="320" height="32" rx="12" fill="#ffffff" fill-opacity="0.05"/>
    <!-- Window Dots -->
    <circle cx="20" cy="16" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="36" cy="16" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="52" cy="16" r="5" fill="#10b981" opacity="0.8"/>
    <!-- Mock UI Elements inside Card -->
    <rect x="20" y="52" width="120" height="12" rx="4" fill="#38bdf8" opacity="0.6"/>
    <rect x="20" y="76" width="280" height="8" rx="3" fill="#ffffff" opacity="0.15"/>
    <rect x="20" y="94" width="220" height="8" rx="3" fill="#ffffff" opacity="0.15"/>
    <rect x="20" y="112" width="250" height="8" rx="3" fill="#ffffff" opacity="0.15"/>
    <!-- Cloud / Virtual Desktop Symbol -->
    <path d="M 230 160 C 220 160 210 150 212 140 C 205 138 200 130 203 122 C 208 112 220 110 228 114 C 232 105 245 105 252 112 C 260 110 270 118 268 128 C 275 132 275 145 266 150 C 262 158 240 160 230 160 Z" fill="url(#accent-purple)" opacity="0.5"/>
  </g>

  <!-- FOREGROUND CONTENT: Title & Subtitle (Guaranteed High Contrast & Unobscured) -->
  <g transform="translate(80, 0)">
    <!-- Badge Pill -->
    <g transform="translate(0, 75)">
      <rect width="260" height="32" rx="16" fill="#0369a1" fill-opacity="0.4" stroke="#0284c7" stroke-width="1"/>
      <text x="16" y="21" class="badge-text">⚡ AWESOME DAAS &amp; VDI</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="170" class="title" filter="url(#drop-shadow)">
      Desktop-As-A-Service
    </text>
    <text x="0" y="225" class="title" fill="url(#accent-cyan)" filter="url(#drop-shadow)">
      &amp; Cloud PC Ecosystem
    </text>

    <!-- Subtitle -->
    <text x="0" y="280" class="subtitle">
      A curated directory of Cloud Desktops, VDI, Remote Apps &amp; Gateway Solutions.
    </text>
    <text x="0" y="310" class="subtitle" font-size="16px" fill="#94a3b8">
      Featuring Enterprise SaaS Platforms &amp; Production-Grade Open-Source Projects.
    </text>
  </g>
</svg>
